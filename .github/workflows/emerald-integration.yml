name: POC-02 genuine Emerald overworld source integration
on:
  push:
    paths:
      - "integration/emerald/**"
      - "include/d20*"
      - "src/d20*"
      - ".github/workflows/emerald-integration.yml"
    branches:
      - main
  pull_request:
    paths:
      - "integration/emerald/**"
      - "include/d20*"
      - "src/d20*"
      - ".github/workflows/emerald-integration.yml"
  workflow_dispatch:
jobs:
  emerald-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GAME_VERSION: EMERALD
      COMPARE: 0
      UNUSED_ERROR: 1
    steps:
      - name: Checkout PokeDnD source only
        uses: actions/checkout@v4
      - name: Install native GBA cross-toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 build-essential
      - name: Fetch pinned upstream privately for build
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/rh-hideout/pokeemerald-expansion.git
          git -C upstream fetch --no-tags --depth=1 origin 4da9230cf7c1f1d7b0d47b45783b202666fffece
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 4da9230cf7c1f1d7b0d47b45783b202666fffece
      - name: Apply original source-only D20 hook
        run: python3 integration/emerald/apply.py upstream
      - name: Compile real pokeemerald-expansion ROM
        run: |
          make -C upstream -j4 all
      - name: Verify native ARM hook linked into real Emerald ELF
        run: |
          ELF=upstream/pokeemerald.elf
          test -s "$ELF"
          arm-none-eabi-nm "$ELF" | grep ' PokeDnD_HandleOverworldInput$'
          arm-none-eabi-nm "$ELF" | grep ' d20_field_project$'
          arm-none-eabi-nm "$ELF" | grep ' d20_deploy$'
          ROM=$(find upstream -maxdepth 1 -name '*.gba' | head -n 1)
          test -n "$ROM"
          test "$(stat -c %s "$ROM")" -le 33554432
          echo "Native integrated Emerald image: $(stat -c %s "$ROM") bytes"
          sha256sum "$ROM"
      - name: Upload private experimental integrated ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokednd-poc02-emerald-integrated-private
          path: upstream/*.gba
          if-no-files-found: error
          retention-days: 7

  emerald-native-boot:
    needs: emerald-native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact-head private Emerald ROM
        uses: actions/download-artifact@v4
        with:
          name: pokednd-poc02-emerald-integrated-private
          path: rom
      - name: Install native mGBA and display capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mgba-sdl xvfb xdotool x11-apps imagemagick
      - name: Native Emerald ROM boots to a rendered LCD screen
        run: |
          mkdir -p evidence
          ROM=$(find rom -name "*.gba" -type f | head -n 1)
          test -s "$ROM"
          timeout 30s xvfb-run -a -s "-screen 0 800x600x24" bash -euo pipefail -c '
            export SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
            mgba "'"$ROM"'" >evidence/mgba.log 2>&1 &
            EMU=$!
            sleep 10
            if ! kill -0 "$EMU"; then cat evidence/mgba.log; exit 1; fi
            WINDOW=$(xdotool search --onlyvisible --name "mGBA" | head -n 1)
            if [ -z "$WINDOW" ]; then echo "No mGBA game window"; exit 1; fi
            timeout 5s xwd -silent -id "$WINDOW" | convert xwd:- evidence/emerald-native-lcd.png
            kill -9 "$EMU" || true
          '
          test -s evidence/emerald-native-lcd.png
          COLORS=$(identify -format %k evidence/emerald-native-lcd.png)
          echo "Rendered Emerald window colors: $COLORS"
          test "$COLORS" -gt 8
      - name: Upload genuine mGBA LCD evidence
        uses: actions/upload-artifact@v4
        with:
          name: pokednd-poc02-emerald-native-boot-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
