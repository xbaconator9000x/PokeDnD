name: POC-02 experimental Emerald field replay diagnostics
on:
  pull_request:
    paths:
      - "integration/emerald/ci_field_replay.sh"
      - ".github/workflows/emerald-field-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified integrated Emerald ROM
        uses: actions/download-artifact@v4
        with:
          repository: xbaconator9000x/PokeDnD
          run-id: 43583355204
          name: pokednd-poc02-emerald-integrated-private
          path: rom
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install real mGBA display harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mgba-sdl xvfb xdotool x11-apps imagemagick
      - name: Capture startup, title, quickstart and overworld input attempts
        run: |
          ROM=$(find rom -type f -name '*.gba' | head -n 1)
          test -s "$ROM"
          chmod +x integration/emerald/ci_field_replay.sh
          timeout 190s xvfb-run -a -s "-screen 0 800x600x24" \
            integration/emerald/ci_field_replay.sh "$ROM" evidence
      - name: Retain LCD frames and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokednd-emerald-field-replay-diagnostic
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
