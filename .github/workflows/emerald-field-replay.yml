name: POC-02 experimental Emerald field replay diagnostics
on:
  pull_request:
    paths:
      - "integration/emerald/**"
      - "src/d20*"
      - "include/d20*"
      - ".github/workflows/emerald-field-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler and mGBA display harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 build-essential mgba-sdl xvfb xdotool x11-apps imagemagick
      - name: Replay boot and workflow source regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_emerald_field_boot.py' -v
          python3 -m unittest discover -s tests -p 'test_emerald_replay_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_emerald_gdb_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_emerald_gdb_fragmented_checksum.py' -v
          python3 -m unittest discover -s tests -p 'test_emerald_runtime_probe_execution.py' -v
      - name: Fetch exact pinned Emerald source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/rh-hideout/pokeemerald-expansion.git
          git -C upstream fetch --no-tags --depth=1 origin 4da9230cf7c1f1d7b0d47b45783b202666fffece
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 4da9230cf7c1f1d7b0d47b45783b202666fffece
      - name: Apply and compile exact-head native integration
        env:
          GAME_VERSION: EMERALD
          COMPARE: 0
          UNUSED_ERROR: 1
        run: |
          python3 integration/emerald/apply.py upstream --field-replay
          grep -q 'SetWarpDestination(MAP_GROUP(MAP_OLDALE_TOWN)' upstream/src/new_game.c
          make -C upstream -j4 all
          test -s upstream/pokeemerald.elf
          arm-none-eabi-nm upstream/pokeemerald.elf | grep ' PokeDnD_HandleOverworldInput$'
      - name: Replay real mGBA input and capture frames
        run: |
          ROM=$(find upstream -maxdepth 1 -type f -name '*.gba' | head -n 1)
          test -s "$ROM"
          POKEDND_ELF=upstream/pokeemerald.elf timeout 180s xvfb-run -a -s "-screen 0 800x600x24" \
            bash integration/emerald/ci_field_replay.sh "$ROM" evidence
      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokednd-emerald-field-replay-diagnostic
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
