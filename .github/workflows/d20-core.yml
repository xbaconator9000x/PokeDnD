name: PokeDnD D20 core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable-c99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC host regression and demo
        run: make clean test demo CC=gcc
      - name: Clang host regression and demo
        run: make clean test demo CC=clang
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behaviour checks
        run: make clean test CC=gcc CFLAGS="-std=c99 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer"
